name: ci
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx: [clang++-18, clang++-22, g++-13, g++-16]
    steps:
      - uses: actions/checkout@v5
      - name: Install compiler
        # g++-13 and clang++-18 are preinstalled on the runner; the latest two are not
        run: |
          case '${{ matrix.cxx }}' in
            g++-16)
              sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
              sudo apt-get install -y g++-16 ;;
            clang++-22)
              wget -q https://apt.llvm.org/llvm.sh
              chmod +x llvm.sh
              sudo ./llvm.sh 22 ;;
          esac
      - name: Configure
        run: cmake -B build -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        # v143 is MSVC's own front end; ClangCL is clang's, on the MSVC ABI and STL — what a lot of
        # Windows codebases actually build with, and a different front end over the same library.
        toolset: [v143, ClangCL]
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        # The VS generator's -T selects the front end without needing a vcvars shell (Ninja + cl
        # would want one, i.e. a third-party action — not worth the supply-chain surface here).
        run: cmake -B build -T ${{ matrix.toolset }}
      - name: Build
        # Debug on purpose: the VS generator is multi-config, and Release's NDEBUG would vaporize
        # every assert, passing the suite vacuously.
        run: cmake --build build --config Debug --parallel
      - name: Test
        # --timeout: a failing Debug assert on Windows pops a MODAL DIALOG and the runner then
        # waits out the whole job (25 minutes, observed). The timeout turns that hang into a
        # prompt failure.
        run: ctest --test-dir build -C Debug --output-on-failure --timeout 60

  macos:
    # AppleClang against Apple's libc++ — a third standard library, and the one whose hard ban on
    # specializing std::tuple (libc++ 21+) is part of why the std-blanks header was removed.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 60

  modules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build and run `import tacit;` (clang)
        # clang picks the newest libstdc++ on the runner (gcc-14), whose <ranges> hits a type-alias
        # template redefinition under C++20 modules; pin to gcc-13's library, which is bug-free.
        run: |
          FLAGS="-std=c++23 --gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/13 -Iinclude"
          clang++-18 $FLAGS --precompile tacit.cppm -o tacit.pcm
          clang++-18 $FLAGS -fmodule-file=tacit=tacit.pcm tests/module_check.cpp tacit.pcm -o module_check
          ./module_check
      - name: Strict consumer against the $-bearing interface (-pedantic-errors)
        # import injects names, not tokens: a strictly-conforming TU never lexes `$` even though the
        # interface exports it. This is the proof that one module suffices — no tacit.dollar split.
        run: |
          FLAGS="-std=c++23 --gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/13 -Iinclude"
          clang++-18 $FLAGS -pedantic-errors -fmodule-file=tacit=tacit.pcm \
            tests/module_strict_check.cpp tacit.pcm -o module_strict_check
          ./module_strict_check

  packaging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Vendor by copying the headers (no include path, no CMake, no repo)
        # The distribution claim: `_.hpp` and `λ.hpp` are each copy-ONE-file, and `$.hpp` wants only
        # its sibling `_.hpp`. Proven by copying into a bare directory and building from there with
        # the repo's own include path deliberately absent — if any header ever grows a dependency on
        # a file that is not copied alongside it, this fails.
        run: |
          mkdir -p /tmp/vendor/tacit
          cp include/tacit/_.hpp include/tacit/λ.hpp /tmp/vendor/tacit/
          printf '#include <tacit/_.hpp>\n#include <tacit/λ.hpp>\nusing tacit::_;\nint main(){ return ((_ * 2)(21) == 42 && λ(x){ return x + 1; }(41) == 42) ? 0 : 1; }\n' > /tmp/vendor/a.cpp
          g++-13 -std=c++23 -Wall -Wextra -I /tmp/vendor /tmp/vendor/a.cpp -o /tmp/vendor/a && /tmp/vendor/a
          # `_.hpp` alone, under -pedantic-errors: the conforming core carries no `$`
          printf '#include <tacit/_.hpp>\nusing tacit::_;\nint main(){ return (_ == 0)(0) ? 0 : 1; }\n' > /tmp/vendor/b.cpp
          g++-13 -std=c++23 -pedantic-errors -I /tmp/vendor /tmp/vendor/b.cpp -o /tmp/vendor/b && /tmp/vendor/b
          # `$.hpp` next to `_.hpp`, and in the awkward order ($ first, so its own include resolves)
          cp 'include/tacit/$.hpp' /tmp/vendor/tacit/
          printf '#include <tacit/$.hpp>\n#include <tacit/_.hpp>\nusing tacit::_; using tacit::$;\nint main(){ return ($(-1).abs() == 1 && (_ * 2)(21) == 42) ? 0 : 1; }\n' > /tmp/vendor/c.cpp
          g++-13 -std=c++23 -Wall -Wextra -I /tmp/vendor /tmp/vendor/c.cpp -o /tmp/vendor/c && /tmp/vendor/c
      - name: Consume via add_subdirectory (FetchContent / CPM path)
        run: |
          cmake -S tests/packaging -B build-pkg -DCMAKE_CXX_COMPILER=g++-13
          cmake --build build-pkg
          ctest --test-dir build-pkg --output-on-failure
      - name: Consume via install + find_package
        run: |
          cmake -B build-install -DCMAKE_INSTALL_PREFIX="$PWD/_inst"
          cmake --install build-install
          printf 'cmake_minimum_required(VERSION 3.20)\nproject(fp CXX)\nfind_package(tacit REQUIRED)\nadd_executable(a a.cpp)\ntarget_link_libraries(a PRIVATE tacit::tacit)\n' > /tmp/fp_CMakeLists.txt
          mkdir -p /tmp/fp && cp /tmp/fp_CMakeLists.txt /tmp/fp/CMakeLists.txt
          printf '#include <tacit/_.hpp>\nusing tacit::_;\nint main(){ return (_ == 0)(0) ? 0 : 1; }\n' > /tmp/fp/a.cpp
          cmake -S /tmp/fp -B /tmp/fp/build -DCMAKE_PREFIX_PATH="$PWD/_inst" -DCMAKE_CXX_COMPILER=g++-13
          cmake --build /tmp/fp/build
          /tmp/fp/build/a

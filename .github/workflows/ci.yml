name: ci
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++-13, clang++-18]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  modules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run `import tacit;` (clang)
        run: |
          clang++-18 -std=c++23 -Iinclude --precompile tacit.cppm -o tacit.pcm
          clang++-18 -std=c++23 -Iinclude -fmodule-file=tacit=tacit.pcm tests/module_check.cpp tacit.pcm -o module_check
          ./module_check
